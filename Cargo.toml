[package]
name = "text-encoder-decoder"
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
base64 = "0.21"
urlencoding = "2.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
]

[profile.release]
# 最適化設定：WASMのサイズを小さくする
opt-level = "s"
lto = true
